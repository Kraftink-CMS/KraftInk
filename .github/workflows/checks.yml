name: Validate the CMS
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  checks:
    name: Validation (${{ matrix.os }}, PHP ${{ matrix.php }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            php: '8.4'
          - os: ubuntu-24.04
            php: '8.5'
          - os: windows-latest
            php: '8.5'
    env:
      APP_ENV: testing
      APP_LOCALE: fr
      APP_FALLBACK_LOCALE: fr
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: Kraftink-CMS/automation@master
        id: automation
      - name: Locate the shared source version tools
        env:
          AUTOMATION_ROOT: ${{ steps.automation.outputs.root }}
        shell: bash
        run: printf 'RELEASE_SOURCE_VERSION_MODULE=%s/scripts/releases/source-version.mjs\n' "$AUTOMATION_ROOT" >> "$GITHUB_ENV"
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, curl, dom, fileinfo, filter, hash, mbstring, openssl, pdo_sqlite, session, sodium, tokenizer, xml, zip
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Prepare the application configuration
        shell: bash
        run: |
          cp .env.example .env
          php artisan key:generate --force
          composer validate --strict
      - name: Check PHP syntax
        shell: bash
        run: find app bootstrap config database extensions/bundled lang public routes updater scripts/releases -type f -name '*.php' -print0 | xargs -0 -n 1 php -l
      - name: Test core behavior
        if: hashFiles('tests/**/*Test.php') != ''
        run: php artisan test --compact --exclude-group=bundled-extensions tests
      - name: Install frontend dependencies
        run: npm ci --no-fund
      - name: Test frontend and release behavior
        if: hashFiles('tests/**/*.test.mjs') != ''
        shell: bash
        run: |
          shopt -s globstar nullglob
          tests=(tests/**/*.test.mjs)
          node --test "${tests[@]}"
      - name: Build local assets
        if: matrix.os == 'ubuntu-24.04' && matrix.php == '8.5'
        run: npm run build


  result:
    name: Validate changes
    needs: checks
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require every validation to succeed
        env:
          CHECK_RESULT: ${{ needs.checks.result }}
        shell: bash
        run: '[[ "$CHECK_RESULT" == success ]]'
