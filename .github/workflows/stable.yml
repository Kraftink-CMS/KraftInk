name: Stable
run-name: ${{ format('Stable from {0}', inputs.source == 'tag' && inputs.source_tag || inputs.source) }}

on:
  workflow_dispatch:
    inputs:
      source:
        description: Published release to promote
        type: choice
        required: true
        options: [latest-beta, latest-alpha, tag]
        default: latest-beta
      bump:
        description: Stable version level, or auto to keep the source target
        type: choice
        required: true
        options: [auto, patch, minor, major]
        default: auto
      source_tag:
        description: Exact published alpha or beta tag when source is tag
        type: string
        required: false
      notes_mode:
        description: Release notes mode
        type: choice
        options: [auto, append, replace]
        default: auto
      notes:
        description: Optional Markdown message for append or replace
        type: string
        required: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare the stable source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: kraftink-release
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      pull-requests: write
      actions: read
    outputs:
      source_sha: ${{ steps.prepare.outputs.source_sha }}
    steps:
      - name: Validate the workflow branch
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" != workflow_dispatch || "$GITHUB_REF" != refs/heads/dev ]]; then
            echo '::error::Run Stable manually from the dev branch.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Kraftink-CMS/automation@master
        id: automation
      - name: Locate the shared source version tools
        env:
          AUTOMATION_ROOT: ${{ steps.automation.outputs.root }}
        shell: bash
        run: printf 'RELEASE_SOURCE_VERSION_MODULE=%s/scripts/releases/source-version.mjs\n' "$AUTOMATION_ROOT" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Set up PHP for public key resolution
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.5'
          extensions: mbstring, sodium, tokenizer
          coverage: none
      - name: Read the public release verification key
        id: key
        shell: bash
        run: |
          public_key=$(php scripts/releases/public-key.php)
          printf 'public_key=%s\n' "$public_key" >> "$GITHUB_OUTPUT"
      - name: Open the immutable release pull request
        id: prepare
        env:
          REQUESTED_SOURCE: ${{ inputs.source == 'tag' && inputs.source_tag || inputs.source != 'tag' && inputs.source || '' }}
          REQUESTED_BUMP: ${{ inputs.bump }}
          RELEASE_NOTES_MODE: ${{ inputs.notes_mode }}
          RELEASE_NOTES: ${{ inputs.notes }}
          GITHUB_TOKEN: ${{ github.token }}
          KRAFTINK_CMS_SIGNING_PUBLIC_KEY: ${{ steps.key.outputs.public_key }}
        shell: bash
        run: node scripts/releases/promote.mjs run --mode stable --prepare-only --source-tag "$REQUESTED_SOURCE" --bump "$REQUESTED_BUMP" --directory "$RUNNER_TEMP/kraftink-promotion"

  checks:
    needs: prepare
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ needs.prepare.outputs.source_sha }}
    permissions:
      contents: read

  promote:
    name: Publish stable
    needs: [prepare, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: kraftink-release
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      pull-requests: write
      actions: read
      statuses: write
    steps:
      - name: Validate the workflow branch
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" != workflow_dispatch || "$GITHUB_REF" != refs/heads/dev ]]; then
            echo '::error::Run Stable manually from the dev branch.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Kraftink-CMS/automation@master
        id: automation
      - name: Locate the shared source version tools
        env:
          AUTOMATION_ROOT: ${{ steps.automation.outputs.root }}
        shell: bash
        run: printf 'RELEASE_SOURCE_VERSION_MODULE=%s/scripts/releases/source-version.mjs\n' "$AUTOMATION_ROOT" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.5'
          extensions: sodium, zip
          coverage: none
      - name: Prepare the temporary signing key
        id: key
        env:
          KRAFTINK_CMS_SIGNING_PRIVATE_KEY: ${{ secrets.KRAFTINK_CMS_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          umask 077
          printf '%s' "$KRAFTINK_CMS_SIGNING_PRIVATE_KEY" > "$RUNNER_TEMP/kraftink-signing.key"
          public_key=$(php scripts/releases/public-key.php)
          printf 'public_key=%s\n' "$public_key" >> "$GITHUB_OUTPUT"
      - name: Verify and promote the published source
        env:
          REQUESTED_MODE: stable
          KRAFTINK_CHECKED_SOURCE: ${{ needs.prepare.outputs.source_sha }}
          REQUESTED_SOURCE: ${{ inputs.source == 'tag' && inputs.source_tag || inputs.source != 'tag' && inputs.source || '' }}
          REQUESTED_BUMP: ${{ inputs.bump }}
          RELEASE_NOTES_MODE: ${{ inputs.notes_mode }}
          RELEASE_NOTES: ${{ inputs.notes }}
          GITHUB_TOKEN: ${{ github.token }}
          KRAFTINK_CMS_SIGNING_PUBLIC_KEY: ${{ steps.key.outputs.public_key }}
          KRAFTINK_CMS_SIGNING_PRIVATE_KEY_FILE: ${{ runner.temp }}/kraftink-signing.key
        shell: bash
        run: node scripts/releases/promote.mjs run --mode "$REQUESTED_MODE" --source-tag "$REQUESTED_SOURCE" --bump "$REQUESTED_BUMP" --directory "$RUNNER_TEMP/kraftink-promotion"
      - name: Remove the temporary signing key
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/kraftink-signing.key"
